[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebardxf"
version = "1.0.0"
description = "Automatic structural drawings and rebar detailing to DXF: beam and column sections, footing details, foundation plans, frame elevations, rebar schedules, bar shapes and quantities, title and revision blocks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["dxf", "rebar", "detailing", "structural-drawings", "ezdxf", "reinforced-concrete", "bar-bending-schedule"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["ezdxf>=1.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "httpx>=0.27"]
autocad = ["pyautocad>=0.2"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.2", "hypothesis>=6.0"]

[project.scripts]
rebardxf = "rebardxf.cli:main"

[project.urls]
Homepage = "https://github.com/jmurgass99/rebardxf"
Repository = "https://github.com/jmurgass99/rebardxf"
Issues = "https://github.com/jmurgass99/rebardxf/issues"

[tool.setuptools.packages.find]
include = ["rebardxf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "property: property-based con hypothesis",
]
